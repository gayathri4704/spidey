<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Dark Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#28242a"/>
      <stop offset="100%" stop-color="#1e1e27"/>
    </linearGradient>
    
    <!-- Premium Spidey Red Gradient -->
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d6d"/>
      <stop offset="40%" stop-color="#df0139"/>
      <stop offset="100%" stop-color="#800020"/>
    </linearGradient>

    <!-- Subtle Drop Shadow / Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#df0139" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base background (for maskable icon support) -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>
  
  <!-- Abstract cyber / spider web ring background -->
  <g stroke="#df0139" stroke-width="2" opacity="0.15">
    <circle cx="256" cy="256" r="210" fill="none" />
    <circle cx="256" cy="256" r="140" fill="none" stroke-dasharray="10, 20" />
    <path d="M 256 36 L 256 476 M 36 256 L 476 256 M 100 100 L 412 412 M 100 412 L 412 100" />
  </g>

  <!-- Futuristic sharp 'S' logo -->
  <path 
    fill="url(#logoGrad)" 
    filter="url(#glow)"
    d="M 406 116 L 186 116 L 146 196 L 326 196 L 266 316 L 146 316 L 106 396 L 326 396 L 366 316 L 186 316 L 246 196 L 366 196 Z" 
  />

  <!-- Subtle accent highlights on the logo -->
  <path 
    fill="#ffffff" 
    opacity="0.3"
    d="M 406 116 L 186 116 L 146 196 L 156 196 L 196 116 L 406 116 Z" 
  />
  <path 
    fill="#ffffff" 
    opacity="0.2"
    d="M 326 396 L 106 396 L 146 316 L 156 316 L 116 396 L 326 396 Z" 
  />
</svg>
